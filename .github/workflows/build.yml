name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug 2>&1 | tee build.log
      - name: Publish error log
        if: failure()
        run: |
          grep -n -B2 -A14 -E "^e: |FAILURE:|What went wrong|error:" build.log | head -150 > "$HOME/errors.txt" || true
          tail -40 build.log >> "$HOME/errors.txt"
          git config user.name build-bot
          git config user.email build-bot@users.noreply.github.com
          git checkout --orphan build-log
          git rm -rf --quiet . || true
          cp "$HOME/errors.txt" errors.txt
          git add errors.txt
          git commit -m "Build error log"
          git push --force origin build-log
      - uses: actions/upload-artifact@v4
        with:
          name: earbud-finder-apk
          path: app/build/outputs/apk/debug/app-debug.apk
